name: Test ISO image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - distro/**
      - .github/workflows/test_iso_image.yml
      - tools/nixos/**
  push:
    branches:
      - main
    paths:
      - distro/**
      - .github/workflows/test_iso_image.yml
      - tools/nixos/**

jobs:
  iso-test:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'ubuntu-4-cores-150GB-ssd' }}
    container:
      image: asterinas/kernel-dev:0.18.1-20260926
      options: -v /dev:/dev --privileged
      volumes:
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
      - uses: actions/checkout@v4
      - name: Build Asterinas NixOS ISO installer image
        run: |
          make iso NIXOS_TEST_SUITE=hello
      - name: Run ISO image and install Asterinas NixOS
        run: |
          make run_iso || true
          tail --lines 10 qemu.log | grep -q "^Congratulations!" || (echo "Test ISO failed" && exit 1)
          echo "Test ISO succeeds!"
      - name : Run Asterinas NixOS
        run: |
          make run_nixos NIXOS_TEST_SUITE=hello
